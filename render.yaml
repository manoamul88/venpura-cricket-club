services:
  - type: web
    name: venpura-cricket-club
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: VENPURA_ADMIN_USERNAME
        sync: false
      - key: VENPURA_ADMIN_PASSWORD
        sync: false
      - key: VENPURA_ADMIN_FIRST_NAME
        value: Club
      - key: VENPURA_ADMIN_LAST_NAME
        value: Admin
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://venpura-cricket-club.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
